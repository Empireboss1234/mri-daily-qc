<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MRI Daily QC Logbook | MedPhys QA</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @media print {
            @page { size: A4 portrait; margin: 15mm; }
            .no-print { display: none !important; }
            body {
                background: white;
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
            .page-break { page-break-before: always; }
            .break-inside-avoid { break-inside: avoid; page-break-inside: avoid; }

            #report-content { width: 100%; max-width: 100%; margin: 0; padding: 0; }
            canvas { max-width: 100% !important; }
        }

        .print-only { display: none; }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- Configuration & Constants ---
        const MACHINE_PROFILES = {
            '1.5T': {
                name: 'Philips Ingenia Ambition S 1.5 T.',
                baseFreq: 63860000,
                // --- แยก Limit 2 ตัวชัดเจน ---
                cfMin: 63570000, 
                cfMax: 64180000,
                deltaFreqMin: -100, 
                deltaFreqMax: 100,
                // -------------------------
                isZeroBoilOff: true,
                roomTempMax: 24.0,
                roomHumidMax: 70.0,
                chillerTempMin: 8.0,
                chillerTempMax: 13.0,
                waterFlowMin: 3500.0,
                gcOutTMax: 35.0,
                gaOutTMax: 35.0,
                gcInPMin: 0.7,
                gcInPMax: 22.0,
                gaInPMin: 0.7,
                gaInPMax: 22.0,
                gc3WayVMin: 0.0,
                gc3WayVMax: 10.0,
                ga3WayVMin: 0.0,
                ga3WayVMax: 10.0
            },
            '3.0T': {
                name: 'Philips Achieva dStream 3.0 T.',
                baseFreq: 127720000,
                // --- แยก Limit 2 ตัวชัดเจน ---
                cfMin: 127370000, 
                cfMax: 128090000, 
                deltaFreqMin: -100, 
                deltaFreqMax: 100,  
                // -------------------------
                heMin: 50.0,
                waterTempMax: 12.0,
                roomTempMax: 24.0,
                roomHumidMax: 70.0,
                chillerTempMin: 8.0,
                chillerTempMax: 13.0,
                waterFlowMin: 3500.0,
                gcOutTMax: 35.0,
                gaOutTMax: 35.0,
                gcInPMin: 0.7,
                gcInPMax: 22.0,
                gaInPMin: 0.7,
                gaInPMax: 22.0,
                gc3WayVMin: 0.0,
                gc3WayVMax: 10.0,
                ga3WayVMin: 0.0,
                ga3WayVMax: 10.0
            }
        };

        const CHECKLIST_ITEMS = [
            { id: 'console_clean', label: 'Console Area Cleanliness' },
            { id: 'server_room_clean', label: 'Server Room Cleanliness' },
            { id: 'table_display', label: 'Table Position & Display' },
            { id: 'laser', label: 'Laser Alignment' },
            { id: 'table_lock', label: 'Table Lock Integrity' },
            { id: 'table_motion', label: 'Table Movement Control' },
            { id: 'gantry_fan', label: 'Gantry Fan Status' },
            { id: 'gantry_lights', label: 'Gantry Status Lights' },
            { id: 'room_lights', label: 'Magnet Room Lights' },
            { id: 'bore_lights', label: 'Bore Lighting' },
            { id: 'cold_head', label: 'Cold Head Function' },
            { id: 'patient_monitor', label: 'Patient Monitor' },
            { id: 'intercom', label: 'Intercom & Patient Squeeze Ball' },
            { id: 'cctv', label: 'CCTV Monitor' },
            { id: 'emergency_buttons', label: 'Emergency Table Stop/Quench integrity' },
            { id: 'oxygen_sensor', label: 'Oxygen Monitor Check' }
        ];

        // --- Utils ---
        const generateId = () => Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
        const formatDate = (dateStr) => new Date(dateStr).toLocaleDateString('en-GB');

        const getEmptyFormData = () => ({
            date: new Date().toISOString().split('T')[0],
            performedBy: '',
            deltaFreq: '', // New Field: Delta Freq (Primary)
            cf: '',        // Absolute CF (Optional)
            tg: '',
            waterTemp: '',
            waterFlow: '',
            chillerTemp: '',
            roomTemp: '',
            roomHumidity: '',
            heliumLevel: '',
            gcOutT: '',
            gaOutT: '',
            gcInP: '',
            gaInP: '',
            heReT: '',
            gc3WayV: '',
            ga3WayV: '',
            checklist: {},
            analysisComment: '',
            testConclusion: ''
        });

        const buildToleranceRules = (profile) => ({
            // กฎของ Delta
            deltaFreq: (profile.deltaFreqMin !== undefined || profile.deltaFreqMax !== undefined) 
                ? { label: 'Delta Frequency', min: profile.deltaFreqMin, max: profile.deltaFreqMax, unit: 'Hz' } 
                : null,
                
            // กฎของ Absolute CF
            cf: (profile.cfMin !== undefined || profile.cfMax !== undefined)
                ? { label: 'Center Frequency', min: profile.cfMin, max: profile.cfMax, unit: 'Hz' }
                : null,
                
            heliumLevel: (!profile.isZeroBoilOff && profile.heMin !== undefined)
                ? { label: 'Helium Level', min: profile.heMin, unit: '%' } : null,
            chillerTemp: (profile.chillerTempMin !== undefined || profile.chillerTempMax !== undefined)
                ? { label: 'Chiller Temp', min: profile.chillerTempMin, max: profile.chillerTempMax, unit: '°C' } : null,
            waterTemp: (profile.waterTempMax !== undefined)
                ? { label: 'Pri. Water Temp', max: profile.waterTempMax, unit: '°C' } : null,
            waterFlow: (profile.waterFlowMin !== undefined)
                ? { label: 'Pri. Water Flow', min: profile.waterFlowMin, unit: 'L/H' } : null,
            roomTemp: (profile.roomTempMax !== undefined)
                ? { label: 'Room Temp', max: profile.roomTempMax, unit: '°C' } : null,
            roomHumidity: (profile.roomHumidMax !== undefined)
                ? { label: 'Room Humidity', max: profile.roomHumidMax, unit: '%' } : null,
            gcOutT: (profile.gcOutTMax !== undefined)
                ? { label: 'GC Out T', max: profile.gcOutTMax, unit: '°C' } : null,
            gaOutT: (profile.gaOutTMax !== undefined)
                ? { label: 'GA Out T', max: profile.gaOutTMax, unit: '°C' } : null,
            gcInP: (profile.gcInPMin !== undefined || profile.gcInPMax !== undefined)
                ? { label: 'GC In P', min: profile.gcInPMin, max: profile.gcInPMax, unit: 'bar' } : null,
            gaInP: (profile.gaInPMin !== undefined || profile.gaInPMax !== undefined)
                ? { label: 'GA In P', min: profile.gaInPMin, max: profile.gaInPMax, unit: 'bar' } : null,
            gc3WayV: (profile.gc3WayVMin !== undefined || profile.gc3WayVMax !== undefined)
                ? { label: 'GC 3-Way V.', min: profile.gc3WayVMin, max: profile.gc3WayVMax, unit: 'v.' } : null,
            ga3WayV: (profile.ga3WayVMin !== undefined || profile.ga3WayVMax !== undefined)
                ? { label: 'GA 3-Way V.', min: profile.ga3WayVMin, max: profile.ga3WayVMax, unit: 'v.' } : null
        });

        const getViolationMessage = (num, rule) => {
            if (!rule) return '';
            if (rule.min !== undefined && num < rule.min) return 'น้อยกว่า tolerance';
            if (rule.max !== undefined && num > rule.max) return rule.min !== undefined ? 'มากกว่า tolerance' : 'เกิน tolerance';
            return '';
        };

        const evaluateFieldAgainstRule = (value, rule) => {
            if (!rule || value === '' || value === null || value === undefined) {
                return { isOut: false, numericValue: null, message: '' };
            }
            const numericValue = parseFloat(value);
            if (Number.isNaN(numericValue)) return { isOut: false, numericValue: null, message: '' };
            const message = getViolationMessage(numericValue, rule);
            return { isOut: !!message, numericValue, message };
        };

        const evaluateRecordStatus = (record, profile) => {
            const rules = buildToleranceRules(profile);
            const violations = Object.entries(rules)
                .filter(([, rule]) => !!rule)
                .map(([field, rule]) => {
                    const result = evaluateFieldAgainstRule(record[field], rule);
                    if (!result.isOut) return null;
                    return { field, label: rule.label, value: result.numericValue, unit: rule.unit || '', message: result.message };
                }).filter(Boolean);

            return {
                status: violations.length > 0 ? 'NOT PASS' : 'PASS',
                violations
            };
        };

        const violationTextPlugin = {
            id: 'violationTextPlugin',
            afterDatasetsDraw(chart, args, pluginOptions) {
                const labels = pluginOptions?.labels || [];
                if (!labels.length) return;
                const meta = chart.getDatasetMeta(0);
                const { ctx } = chart;
                ctx.save();
                ctx.font = '10px sans-serif';
                ctx.fillStyle = '#dc2626';
                ctx.textAlign = 'center';
                labels.forEach(item => {
                    const point = meta.data[item.index];
                    if (!point) return;
                    ctx.fillText(item.text, point.x, point.y - 10);
                });
                ctx.restore();
            }
        };
        Chart.register(violationTextPlugin);

        // --- Components ---
        const Card = ({ title, children, className = "" }) => (
            <div className={`bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden ${className}`}>
                {title && <div className="px-6 py-4 border-b border-slate-100 font-semibold text-slate-700">{title}</div>}
                <div className="p-6">{children}</div>
            </div>
        );

        const TrendChart = ({ data, label, color, upperLimit, lowerLimit, showLimits = true }) => {
            const canvasRef = useRef(null);
            const chartInstanceRef = useRef(null);

            useEffect(() => {
                if (!canvasRef.current) return;
                const ctx = canvasRef.current.getContext('2d');
                if (chartInstanceRef.current) chartInstanceRef.current.destroy();

                const validData = data.filter(d => {
                    if (d.value === '' || d.value === null || d.value === undefined) return false;
                    return !Number.isNaN(parseFloat(d.value));
                });

                const dates = validData.map(d => new Date(d.date).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }));
                const values = validData.map(d => parseFloat(d.value));

                const violationLabels = validData.map((d, index) => {
                    // Only display text warning if showLimits is enabled
                    if (!showLimits) return null;
                    const result = evaluateFieldAgainstRule(d.value, { min: lowerLimit, max: upperLimit });
                    return result.isOut ? { index, text: result.message, value: result.numericValue } : null;
                }).filter(Boolean);

                const violationMap = Object.fromEntries(violationLabels.map(v => [v.index, v]));
                const pointBackgroundColor = values.map((_, idx) => violationMap[idx] ? '#dc2626' : color);
                const pointBorderColor = values.map((_, idx) => violationMap[idx] ? '#dc2626' : color);
                const pointRadius = values.map((_, idx) => violationMap[idx] ? 5 : 3);
                const pointHoverRadius = values.map((_, idx) => violationMap[idx] ? 7 : 6);

                const datasets = [{
                    label: label,
                    data: values,
                    borderColor: color,
                    backgroundColor: color + '20',
                    tension: 0.2,
                    borderJoinStyle: 'round',
                    pointBackgroundColor,
                    pointBorderColor,
                    pointRadius,
                    pointHoverRadius
                }];

                if (showLimits && values.length > 0) {
                    if (upperLimit !== undefined) {
                        datasets.push({ label: 'Upper Limit', data: values.map(() => upperLimit), borderColor: '#ef4444', borderDash: [5, 5], pointRadius: 0, borderWidth: 1.5, fill: false });
                    }
                    if (lowerLimit !== undefined) {
                        datasets.push({ label: 'Lower Limit', data: values.map(() => lowerLimit), borderColor: '#ef4444', borderDash: [5, 5], pointRadius: 0, borderWidth: 1.5, fill: false });
                    }
                }

                chartInstanceRef.current = new Chart(ctx, {
                    type: 'line',
                    data: { labels: dates, datasets: datasets },
                    options: {
                        animation: false,
                        responsive: true,
                        maintainAspectRatio: false,
                        interaction: { mode: 'index', intersect: false },
                        scales: {
                            y: { display: true, title: { display: false } },
                            x: { ticks: { maxRotation: 45, minRotation: 0 } }
                        },
                        plugins: {
                            legend: { position: 'top', labels: { boxWidth: 12, usePointStyle: true, font: { size: 11 } } },
                            tooltip: { callbacks: { afterLabel: function(context) { const v = violationMap[context.dataIndex]; return v ? `⚠️ ${v.text}` : ''; } } },
                            violationTextPlugin: { labels: violationLabels }
                        }
                    }
                });

                return () => { if (chartInstanceRef.current) chartInstanceRef.current.destroy(); };
            }, [data, label, color, upperLimit, lowerLimit, showLimits]);

            return <canvas ref={canvasRef}></canvas>;
        };

        // --- Main Application ---
        const App = () => {
            const SCRIPT_URL = 'YOUR_GOOGLE_APPS_SCRIPT_URL_HERE'; // Replace with actual URL

            const [activeTab, setActiveTab] = useState('new');
            const [selectedMachine, setSelectedMachine] = useState('3.0T');
            const [records, setRecords] = useState([]);
            const [editingId, setEditingId] = useState(null);
            const [filterYear, setFilterYear] = useState(new Date().getFullYear().toString());
            const [filterMonth, setFilterMonth] = useState('all');
            const [formData, setFormData] = useState(getEmptyFormData());

            useEffect(() => {
                const savedRecords = localStorage.getItem('mri_qa_records');
                const localData = savedRecords ? JSON.parse(savedRecords) : [];
                if (localData.length > 0) setRecords(localData);

                // Mock Fetch for Offline testing / Replace with real fetch
                fetch(SCRIPT_URL)
                    .then(res => res.json())
                    .then(cloudData => {
                        if (Array.isArray(cloudData)) {
                            const cloudIds = new Set(cloudData.map(r => r.id));
                            const uniqueLocalData = localData.filter(r => !cloudIds.has(r.id));
                            const combinedData = [...cloudData, ...uniqueLocalData].sort((a, b) => new Date(b.date) - new Date(a.date));
                            setRecords(combinedData);
                            localStorage.setItem('mri_qa_records', JSON.stringify(combinedData));
                        }
                        setTimeout(() => lucide.createIcons(), 50);
                    })
                    .catch(err => {
                        console.error('Fetch Error (Using Offline Data):', err);
                        setTimeout(() => lucide.createIcons(), 50);
                    });
            }, []);

            useEffect(() => { localStorage.setItem('mri_qa_records', JSON.stringify(records)); }, [records]);
            useEffect(() => { setTimeout(() => lucide.createIcons(), 50); }, [activeTab, selectedMachine, filterYear, filterMonth, records]);

            const handleInputChange = (e) => {
                const { name, value, type, checked } = e.target;
                if (type === 'checkbox') {
                    setFormData(prev => ({ ...prev, checklist: { ...prev.checklist, [name]: checked } }));
                } else {
                    setFormData(prev => ({ ...prev, [name]: value }));
                }
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                const profile = MACHINE_PROFILES[selectedMachine];
                const { status, violations } = evaluateRecordStatus(formData, profile);

                const recordData = {
                    timestamp: new Date().toISOString(),
                    machine: selectedMachine,
                    ...formData,
                    status,
                    violations
                };

                const finalRecord = { ...recordData, id: editingId ? editingId : generateId() };

                if (editingId) {
                    setRecords(prev => prev.map(r => r.id === editingId ? finalRecord : r));
                    setEditingId(null);
                } else {
                    setRecords(prev => [finalRecord, ...prev]);
                }

                // Push to Cloud (Silently fail if offline)
                fetch(SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(finalRecord),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                }).catch(error => console.error('Error saving to Cloud:', error));

                alert(editingId ? `QC Record Updated Successfully (${status})` : `QC Record Saved! (${status})`);
                setActiveTab('dashboard');
                resetForm();
            };

            const resetForm = () => {
                setFormData(getEmptyFormData());
                setEditingId(null);
            };

            const handleEdit = (record) => {
                setEditingId(record.id);
                setSelectedMachine(record.machine);
                setFormData({
                    date: record.date,
                    performedBy: record.performedBy,
                    deltaFreq: record.deltaFreq || '',
                    cf: record.cf || '',
                    tg: record.tg || '',
                    waterTemp: record.waterTemp || '',
                    waterFlow: record.waterFlow || '',
                    chillerTemp: record.chillerTemp || '',
                    roomTemp: record.roomTemp || '',
                    roomHumidity: record.roomHumidity || '',
                    heliumLevel: record.heliumLevel || '',
                    gcOutT: record.gcOutT || '',
                    gaOutT: record.gaOutT || '',
                    gcInP: record.gcInP || '',
                    gaInP: record.gaInP || '',
                    heReT: record.heReT || '',
                    gc3WayV: record.gc3WayV || '',
                    ga3WayV: record.ga3WayV || '',
                    checklist: record.checklist || {},
                    analysisComment: record.analysisComment || '',
                    testConclusion: record.testConclusion || ''
                });
                setActiveTab('new');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            };

            const handleExportCSV = () => {
                const headers = [
                    'Date', 'Machine', 'User', 'Status', 'Violations', 'Delta Freq (Hz)', 'Absolute CF', 'Transmitter Gain', 'Helium Level',
                    'Chiller Temp', 'Water Temp', 'Water Flow', 'Room Temp', 'Room Humidity', 'GC Out T', 'GA Out T',
                    'GC In P', 'GA In P', 'HE RE T', 'GC 3-Way V', 'GA 3-Way V', 'Analysis', 'Conclusion'
                ];

                const exportData = filteredRecords;
                const rows = exportData.map(r => [
                    r.date, r.machine, r.performedBy, r.status,
                    `"${(r.violations || []).map(v => `${v.label}: ${v.message}`).join(' | ')}"`,
                    r.deltaFreq, r.cf, r.tg, r.heliumLevel, r.chillerTemp, r.waterTemp, r.waterFlow, r.roomTemp, r.roomHumidity,
                    r.gcOutT, r.gaOutT, r.gcInP, r.gaInP, r.heReT, r.gc3WayV, r.ga3WayV,
                    `"${r.analysisComment || ''}"`, `"${r.testConclusion || ''}"`
                ]);

                const csvContent = "data:text/csv;charset=utf-8," + [headers.join(','), ...rows.map(e => e.join(','))].join("\n");
                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", `mri_qa_export_${new Date().toISOString().slice(0,10)}.csv`);
                document.body.appendChild(link);
                link.click();
            };

            const handleDelete = (id) => {
                if (window.confirm('Are you sure you want to delete this record?')) {
                    setRecords(prev => prev.filter(r => r.id !== id));
                    fetch(SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action: 'delete', id: id }),
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                    }).catch(err => console.error('Error deleting from Cloud:', err));
                }
            };

            const currentProfile = MACHINE_PROFILES[selectedMachine];
            const currentRules = useMemo(() => buildToleranceRules(currentProfile), [currentProfile]);

            const evaluatedRecords = useMemo(() => {
                return records.map(r => {
                    const profile = MACHINE_PROFILES[r.machine] || MACHINE_PROFILES['3.0T'];
                    const { status, violations } = evaluateRecordStatus(r, profile);
                    return { ...r, status, violations };
                });
            }, [records]);

            const availableYears = useMemo(() => {
                const years = new Set(evaluatedRecords.map(r => new Date(r.date).getFullYear()));
                years.add(new Date().getFullYear());
                return Array.from(years).sort((a, b) => b - a);
            }, [evaluatedRecords]);

            const filteredRecords = useMemo(() => {
                return evaluatedRecords
                    .filter(r => {
                        if (r.machine !== selectedMachine) return false;
                        if (filterYear !== 'all' && new Date(r.date).getFullYear().toString() !== filterYear) return false;
                        if (filterMonth !== 'all' && new Date(r.date).getMonth().toString() !== filterMonth) return false;
                        return true;
                    })
                    .sort((a, b) => new Date(a.date) - new Date(b.date));
            }, [evaluatedRecords, selectedMachine, filterYear, filterMonth]);

            const latestRecord = filteredRecords.length ? filteredRecords[filteredRecords.length - 1] : null;
            const recent7Records = filteredRecords.slice(-7);

            const getFieldWarning = (fieldName) => evaluateFieldAgainstRule(formData[fieldName], currentRules[fieldName]);
            const isFieldWarning = (fieldName) => getFieldWarning(fieldName).isOut;
            const getWarningText = (fieldName) => getFieldWarning(fieldName).message;

            const inputClass = (fieldName, extra = '') =>
                `w-full p-2 border rounded-md outline-none ${
                    isFieldWarning(fieldName) ? 'border-red-500 ring-1 ring-red-500' : 'border-slate-300 focus:ring-2 focus:ring-blue-500'
                } ${extra}`;

            // Chart Data Prep (All 16 Data points)
            const deltaFreqData = filteredRecords.map(r => {
                let val = r.deltaFreq;
                // ถ้าระบบหาค่า Delta ไม่เจอ แต่มีค่า CF เดิมอยู่ ให้คำนวณย้อนหลังอัตโนมัติ
                if ((val === '' || val === undefined || val === null) && r.cf) {
                    const profile = MACHINE_PROFILES[r.machine];
                    val = parseFloat(r.cf) - profile.baseFreq;
                }
                return { date: r.date, value: val };
            });
            const cfData = filteredRecords.map(r => ({ date: r.date, value: r.cf }));

            // อัปเดตตัวแปรสำหรับแสดง KPI ด้านบนด้วย
            let displayLatestDelta = latestRecord?.deltaFreq;
            if ((displayLatestDelta === undefined || displayLatestDelta === '' || displayLatestDelta === null) && latestRecord?.cf) {
                const profile = MACHINE_PROFILES[latestRecord.machine];
                displayLatestDelta = parseFloat(latestRecord?.cf) - profile.baseFreq;
            }
            
            const tgData = filteredRecords.map(r => ({ date: r.date, value: r.tg }));
            const heliumData = filteredRecords.map(r => ({ date: r.date, value: r.heliumLevel }));
            const chillerTempData = filteredRecords.map(r => ({ date: r.date, value: r.chillerTemp }));
            const waterTempData = filteredRecords.map(r => ({ date: r.date, value: r.waterTemp }));
            const waterFlowData = filteredRecords.map(r => ({ date: r.date, value: r.waterFlow }));
            const roomTempData = filteredRecords.map(r => ({ date: r.date, value: r.roomTemp }));
            const roomHumidityData = filteredRecords.map(r => ({ date: r.date, value: r.roomHumidity }));
            const gcOutTData = filteredRecords.map(r => ({ date: r.date, value: r.gcOutT }));
            const gaOutTData = filteredRecords.map(r => ({ date: r.date, value: r.gaOutT }));
            const gcInPData = filteredRecords.map(r => ({ date: r.date, value: r.gcInP }));
            const gaInPData = filteredRecords.map(r => ({ date: r.date, value: r.gaInP }));
            const heReTData = filteredRecords.map(r => ({ date: r.date, value: r.heReT }));
            const gc3WayVData = filteredRecords.map(r => ({ date: r.date, value: r.gc3WayV }));
            const ga3WayVData = filteredRecords.map(r => ({ date: r.date, value: r.ga3WayV }));
            
            const statusCounts = {
                pass: filteredRecords.filter(r => r.status === 'PASS').length,
                notPass: filteredRecords.filter(r => r.status === 'NOT PASS').length
            };

            return (
                <div className="min-h-screen pb-12">
                    {/* Header */}
                    <header className="bg-slate-900 text-white shadow-lg no-print">
                        <div className="max-w-[95%] mx-auto px-4 py-4 flex justify-between items-center">
                            <div className="flex items-center gap-3">
                                <div className="bg-blue-500 p-2 rounded-lg"><i data-lucide="activity" className="text-white w-6 h-6"></i></div>
                                <div><h1 className="text-xl font-bold tracking-tight">MRI QA Manager</h1><p className="text-xs text-slate-400">Daily Quality Control Logbook</p></div>
                            </div>
                            <div className="flex items-center gap-4">
                                <select value={selectedMachine} onChange={(e) => setSelectedMachine(e.target.value)} className="bg-slate-800 border border-slate-700 text-white text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 p-2.5 outline-none">
                                    {Object.keys(MACHINE_PROFILES).map(key => (<option key={key} value={key}>{MACHINE_PROFILES[key].name}</option>))}
                                </select>
                            </div>
                        </div>
                    </header>

                    {/* Navigation */}
                    <nav className="max-w-[95%] mx-auto px-4 py-6 no-print">
                        <div className="flex space-x-4 border-b border-slate-200">
                            {[{ id: 'new', label: 'New Entry', icon: 'plus-circle' }, { id: 'dashboard', label: 'Dashboard & Analysis', icon: 'bar-chart-2' }, { id: 'history', label: 'History Log', icon: 'list' }].map(tab => (
                                <button key={tab.id} onClick={() => setActiveTab(tab.id)} className={`flex items-center gap-2 pb-3 px-1 border-b-2 font-medium text-sm transition-colors ${activeTab === tab.id ? 'border-blue-600 text-blue-600' : 'border-transparent text-slate-500 hover:text-slate-700 hover:border-slate-300'}`}>
                                    <i data-lucide={tab.icon} className="w-4 h-4"></i> {tab.label}
                                </button>
                            ))}
                        </div>
                    </nav>

                    {/* Content Area */}
                    <main className="max-w-[95%] mx-auto px-4">
                        
                        {/* VIEW: NEW ENTRY */}
                        {activeTab === 'new' && (
                            <div className="max-w-4xl mx-auto">
                                <div className="mb-4 flex items-center justify-between">
                                    <h2 className="text-xl font-bold text-slate-800">{editingId ? 'Edit Entry' : 'New QC Entry'}</h2>
                                    {editingId && <button onClick={resetForm} className="text-sm text-red-600 hover:text-red-800 underline">Cancel Editing</button>}
                                </div>

                                <form onSubmit={handleSubmit}>
                                    {/* Section 1 */}
                                    <Card title="General Information" className="mb-6 border-t-4 border-blue-500">
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                            <div>
                                                <label className="block text-sm font-medium text-slate-700 mb-1">Date</label>
                                                <input type="date" name="date" required value={formData.date} onChange={handleInputChange} className="w-full p-2 border border-slate-300 rounded-md focus:ring-2 focus:ring-blue-500 outline-none" />
                                            </div>
                                            <div>
                                                <label className="block text-sm font-medium text-slate-700 mb-1">Performed By</label>
                                                <input type="text" name="performedBy" required placeholder="e.g. John Doe" value={formData.performedBy} onChange={handleInputChange} className="w-full p-2 border border-slate-300 rounded-md focus:ring-2 focus:ring-blue-500 outline-none" />
                                            </div>
                                        </div>
                                    </Card>

                                    {/* Section 2 */}
                                    <Card title="Visual Checklist & Environment" className="mb-6">
                                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mb-6">
                                            {CHECKLIST_ITEMS.map(item => (
                                                <div key={item.id} className="flex items-center gap-3 p-3 border border-slate-100 rounded-lg hover:bg-blue-50 transition-colors">
                                                    <input type="checkbox" id={item.id} name={item.id} checked={formData.checklist[item.id] || false} onChange={handleInputChange} className="w-5 h-5 text-blue-600 rounded focus:ring-blue-500 border-gray-300 cursor-pointer" />
                                                    <label htmlFor={item.id} className="text-sm font-medium text-slate-700 cursor-pointer">{item.label}</label>
                                                </div>
                                            ))}
                                        </div>
                                        {!currentProfile.isZeroBoilOff && (
                                            <div className="mb-4">
                                                <label className="block text-sm font-medium text-slate-700 mb-1">Helium Level (%)</label>
                                                <input type="number" name="heliumLevel" step="0.1" value={formData.heliumLevel} onChange={handleInputChange} className={inputClass('heliumLevel', 'md:w-1/3')} />
                                                {isFieldWarning('heliumLevel') && <p className="text-red-600 text-xs mt-1">⚠️ {getWarningText('heliumLevel')}</p>}
                                            </div>
                                        )}
                                    </Card>

                                    {/* Section 3: Magnet Parameters (UPDATED) */}
                                    <Card title="Magnet & System Parameters" className="mb-6 bg-blue-50">
                                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                            <div>
                                                <label className="block text-sm font-bold text-blue-800 mb-1">
                                                    Delta Frequency (Hz) <span className="text-red-500">*</span>
                                                    <span className="text-xs text-blue-500 block font-normal">Range: {currentProfile.deltaFreqMin} to {currentProfile.deltaFreqMax} Hz</span>
                                                </label>
                                                <input type="number" name="deltaFreq" required step="1" placeholder="e.g. 32" value={formData.deltaFreq} onChange={handleInputChange} className={inputClass('deltaFreq', 'border-blue-300 bg-white shadow-sm')} />
                                                {isFieldWarning('deltaFreq') && <p className="text-red-600 text-xs mt-1 font-bold">⚠️ {getWarningText('deltaFreq')}</p>}
                                            </div>
                                            
                                            <div>
                                                <label className="block text-sm font-medium text-slate-700 mb-1">
                                                    Absolute CF (Hz) <span className="text-xs text-slate-400 font-normal">(Optional)</span>
                                                    <span className="text-xs text-slate-400 block font-normal">Ref: {currentProfile.baseFreq}</span>
                                                </label>
                                                <input type="number" name="cf" step="1" placeholder="e.g. 127768770" value={formData.cf} onChange={handleInputChange} className="w-full p-2 border border-slate-300 rounded-md focus:ring-2 focus:ring-blue-500 outline-none bg-white" />
                                            </div>

                                            <div>
                                                <label className="block text-sm font-medium text-slate-700 mb-1">
                                                    Transmitter Gain (dB) <span className="text-red-500">*</span>
                                                    <span className="text-xs text-slate-400 block font-normal">Required</span>
                                                </label>
                                                <input type="number" name="tg" required step="0.1" value={formData.tg} onChange={handleInputChange} className="w-full p-2 border border-slate-300 rounded-md focus:ring-2 focus:ring-blue-500 outline-none bg-white" />
                                            </div>
                                        </div>
                                    </Card>

                                    {/* Section 4 */}
                                    <Card title="Primary Cooling & Room Environment" className="mb-6">
                                        <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-4">
                                            {['chillerTemp', 'waterTemp', 'waterFlow', 'roomTemp', 'roomHumidity'].map(field => (
                                                <div key={field}>
                                                    <label className="block text-xs font-bold text-slate-500 uppercase mb-1">
                                                        {currentRules[field]?.label || field}
                                                        {currentRules[field] && (
                                                            <span className="block text-[10px] text-slate-400 normal-case font-normal mt-0.5">
                                                                {currentRules[field].min !== undefined ? `Min: ${currentRules[field].min} ` : ''}
                                                                {currentRules[field].max !== undefined ? `Max: ${currentRules[field].max}` : ''}
                                                            </span>
                                                        )}
                                                    </label>
                                                    <input type="number" name={field} step="0.1" value={formData[field]} onChange={handleInputChange} className={inputClass(field, 'mt-1')} />
                                                    {isFieldWarning(field) && <p className="text-red-600 text-[10px] mt-1">{getWarningText(field)}</p>}
                                                </div>
                                            ))}
                                        </div>
                                    </Card>

                                    {/* Section 5 */}
                                    <Card title="Gradient & Heat Exchanger System" className="mb-6 border-l-4 border-l-blue-500">
                                        <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                                            {['gcOutT', 'gaOutT', 'gcInP', 'gaInP', 'heReT', 'gc3WayV', 'ga3WayV'].map(field => (
                                                <div key={field}>
                                                    <label className="block text-xs font-bold text-slate-500 uppercase mb-1">
                                                        {currentRules[field]?.label || field.replace(/([A-Z])/g, ' $1').trim().toUpperCase()}
                                                        {currentRules[field] && (
                                                            <span className="block text-[10px] text-slate-400 normal-case font-normal mt-0.5">
                                                                {currentRules[field].min !== undefined ? `Min: ${currentRules[field].min} ` : ''}
                                                                {currentRules[field].max !== undefined ? `Max: ${currentRules[field].max}` : ''}
                                                            </span>
                                                        )}
                                                        {!currentRules[field] && <span className="block text-[10px] text-transparent normal-case font-normal mt-0.5">.</span>}
                                                    </label>
                                                    <input type="number" name={field} step="0.01" value={formData[field]} onChange={handleInputChange} className={inputClass(field, 'mt-1')} />
                                                    {isFieldWarning(field) && <p className="text-red-600 text-[10px] mt-1">{getWarningText(field)}</p>}
                                                </div>
                                            ))}
                                        </div>
                                    </Card>

                                    {/* Section 6 */}
                                    <Card title="Physicist's Analysis & Conclusion" className="mb-6 border-blue-200 ring-1 ring-blue-100">
                                        <div className="space-y-4">
                                            <div>
                                                <label className="block text-sm font-medium text-slate-700 mb-1">Analysis Result (ผลการวิเคราะห์)</label>
                                                <textarea name="analysisComment" rows="3" value={formData.analysisComment} onChange={handleInputChange} className="w-full p-2 border border-slate-300 rounded-md focus:ring-2 focus:ring-blue-500 outline-none resize-none"></textarea>
                                            </div>
                                            <div>
                                                <label className="block text-sm font-medium text-slate-700 mb-1">Test Conclusion (สรุปผลการทดสอบ)</label>
                                                <textarea name="testConclusion" rows="2" value={formData.testConclusion} onChange={handleInputChange} className="w-full p-2 border border-slate-300 rounded-md focus:ring-2 focus:ring-blue-500 outline-none resize-none"></textarea>
                                            </div>
                                        </div>
                                    </Card>

                                    <div className="flex justify-end gap-3">
                                        <button type="button" onClick={resetForm} className="px-4 py-2 text-slate-600 hover:bg-slate-100 rounded-lg font-medium">Reset Form</button>
                                        <button type="submit" className="px-6 py-2 bg-blue-600 text-white rounded-lg font-medium hover:bg-blue-700 shadow-sm flex items-center gap-2">
                                            <i data-lucide={editingId ? "save" : "cloud-upload"} className="w-4 h-4"></i> {editingId ? 'Update Record' : 'Save to Cloud'}
                                        </button>
                                    </div>
                                </form>
                            </div>
                        )}

                        {/* VIEW: DASHBOARD */}
                        {activeTab === 'dashboard' && (
                            <div className="space-y-6">
                                {filteredRecords.length === 0 ? (
                                    <div className="text-center py-20 bg-white rounded-xl border border-dashed border-slate-300">
                                        <i data-lucide="bar-chart-2" className="w-12 h-12 text-slate-300 mx-auto mb-3"></i>
                                        <p className="text-slate-500">No data available for {currentProfile.name}.</p>
                                    </div>
                                ) : (
                                    <>
                                        {/* Top KPIs */}
                                        <div className="grid grid-cols-1 md:grid-cols-4 gap-6">
                                            <Card className="bg-gradient-to-br from-blue-50 to-white border-blue-100">
                                                <h3 className="text-slate-500 text-sm font-medium">Latest Delta Freq</h3>
                                                <p className="text-2xl font-bold text-slate-800 mt-1">{displayLatestDelta !== undefined && displayLatestDelta !== '' ? displayLatestDelta : '-'} <span className="text-sm font-normal text-slate-500">Hz</span></p>
                                            </Card>
                                            <Card className="bg-gradient-to-br from-indigo-50 to-white border-indigo-100">
                                                <h3 className="text-slate-500 text-sm font-medium">Avg Room Temp (7 Days)</h3>
                                                <p className="text-2xl font-bold text-slate-800 mt-1">
                                                    {recent7Records.length > 0 ? (recent7Records.reduce((acc, curr) => acc + parseFloat(curr.roomTemp || 0), 0) / recent7Records.length).toFixed(1) : '-'} <span className="text-sm font-normal text-slate-500">°C</span>
                                                </p>
                                            </Card>
                                            <Card className="bg-gradient-to-br from-emerald-50 to-white border-emerald-100">
                                                <h3 className="text-slate-500 text-sm font-medium">Compliance Rate</h3>
                                                <p className="text-2xl font-bold text-slate-800 mt-1">{Math.round((statusCounts.pass / filteredRecords.length) * 100)}%</p>
                                            </Card>
                                            <Card className={`border ${latestRecord?.status === 'PASS' ? 'bg-gradient-to-br from-green-50 to-white border-green-100' : 'bg-gradient-to-br from-red-50 to-white border-red-100'}`}>
                                                <h3 className="text-slate-500 text-sm font-medium">Latest Status</h3>
                                                <p className={`text-2xl font-bold mt-1 ${latestRecord?.status === 'PASS' ? 'text-green-700' : 'text-red-700'}`}>{latestRecord?.status}</p>
                                            </Card>
                                        </div>

                                        {latestRecord?.violations?.length > 0 && (
                                            <Card title="Latest Out-of-Tolerance Parameters" className="border-red-200 ring-1 ring-red-100">
                                                <div className="flex flex-wrap gap-2">
                                                    {latestRecord.violations.map((v, idx) => <span key={idx} className="px-3 py-1 text-xs rounded-full bg-red-100 text-red-700 font-medium">{v.label}: {v.message}</span>)}
                                                </div>
                                            </Card>
                                        )}

                                        {/* Primary System Graphs */}
                                        <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                                            
                                            {/* กราฟ 1: CF Trend (ซูมดูการดริฟต์รายวัน โดยไม่ใส่เส้น Limit เพื่อให้กราฟ Auto-scale ตัวเอง) */}
                                            <Card title="Center Frequency - Daily Trend (Zoomed)">
                                                <div className="h-64">
                                                    <TrendChart 
                                                        data={cfData} 
                                                        label="CF (Hz)" 
                                                        color="#2563eb" 
                                                        showLimits={false} 
                                                    />
                                                </div>
                                            </Card>

                                            {/* กราฟ 2: Absolute CF (ดูภาพรวม Pass/Fail ตามสเปคบริษัทที่กว้างมาก) */}
                                            <Card title="Absolute Center Frequency (Philips Spec)">
                                                <div className="h-64">
                                                    <TrendChart 
                                                        data={cfData} 
                                                        label="Absolute CF" 
                                                        color="#4f46e5" 
                                                        upperLimit={currentProfile.cfMax} 
                                                        lowerLimit={currentProfile.cfMin} 
                                                        showLimits={true} 
                                                    />
                                                </div>
                                            </Card>

                                            {/* 3. กราฟ Transmitter Gain */}
                                            <Card title="Transmitter Gain Stability (dB)">
                                                <div className="h-64">
                                                    <TrendChart data={tgData} label="Transmitter Gain" color="#0891b2" showLimits={false} />
                                                </div>
                                            </Card>
                                        </div>

                                        {!currentProfile.isZeroBoilOff && (
                                            <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                                                <Card title="Helium Level (%)"><div className="h-64"><TrendChart data={heliumData} label="Helium Level" color="#16a34a" lowerLimit={currentProfile.heMin} showLimits={true} /></div></Card>
                                            </div>
                                        )}

                                        {/* Cooling & Environment Trend (All other parameters) */}
                                        <h3 className="text-lg font-bold text-slate-800 mt-8 mb-2 border-l-4 border-blue-600 pl-3">Cooling & Environment Trend</h3>
                                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                            <Card title="Room Temp (°C)"><div className="h-64"><TrendChart data={roomTempData} label="Room Temp" color="#f43f5e" upperLimit={currentProfile.roomTempMax} showLimits={!!currentProfile.roomTempMax} /></div></Card>
                                            <Card title="Room Humidity (%)"><div className="h-64"><TrendChart data={roomHumidityData} label="Room Humidity" color="#a855f7" upperLimit={currentProfile.roomHumidMax} showLimits={!!currentProfile.roomHumidMax} /></div></Card>
                                            <Card title="Chiller Temp (°C)"><div className="h-64"><TrendChart data={chillerTempData} label="Chiller Temp" color="#7c3aed" upperLimit={currentProfile.chillerTempMax} lowerLimit={currentProfile.chillerTempMin} showLimits={true} /></div></Card>
                                            <Card title="Pri. Water Temp (°C)"><div className="h-64"><TrendChart data={waterTempData} label="Water Temp" color="#0284c7" upperLimit={currentProfile.waterTempMax} showLimits={!!currentProfile.waterTempMax} /></div></Card>
                                            <Card title="Pri. Water Flow (L/H)"><div className="h-64"><TrendChart data={waterFlowData} label="Water Flow" color="#0ea5e9" lowerLimit={currentProfile.waterFlowMin} showLimits={!!currentProfile.waterFlowMin} /></div></Card>
                                            <Card title="HE. RE. T. (°C)"><div className="h-64"><TrendChart data={heReTData} label="HE. RE. T." color="#d97706" showLimits={false} /></div></Card>
                                            <Card title="GC Out T (°C)"><div className="h-64"><TrendChart data={gcOutTData} label="GC Out T" color="#e11d48" upperLimit={currentProfile.gcOutTMax} showLimits={!!currentProfile.gcOutTMax} /></div></Card>
                                            <Card title="GA Out T (°C)"><div className="h-64"><TrendChart data={gaOutTData} label="GA Out T" color="#ea580c" upperLimit={currentProfile.gaOutTMax} showLimits={!!currentProfile.gaOutTMax} /></div></Card>
                                            <Card title="GC In P (bar)"><div className="h-64"><TrendChart data={gcInPData} label="GC In P" color="#059669" upperLimit={currentProfile.gcInPMax} lowerLimit={currentProfile.gcInPMin} showLimits={true} /></div></Card>
                                            <Card title="GA In P (bar)"><div className="h-64"><TrendChart data={gaInPData} label="GA In P" color="#10b981" upperLimit={currentProfile.gaInPMax} lowerLimit={currentProfile.gaInPMin} showLimits={true} /></div></Card>
                                            <Card title="GC 3-Way V. (v.)"><div className="h-64"><TrendChart data={gc3WayVData} label="GC 3-Way V." color="#8b5cf6" upperLimit={currentProfile.gc3WayVMax} lowerLimit={currentProfile.gc3WayVMin} showLimits={!!currentProfile.gc3WayVMax} /></div></Card>
                                            <Card title="GA 3-Way V. (v.)"><div className="h-64"><TrendChart data={ga3WayVData} label="GA 3-Way V." color="#a855f7" upperLimit={currentProfile.ga3WayVMax} lowerLimit={currentProfile.ga3WayVMin} showLimits={!!currentProfile.ga3WayVMax} /></div></Card>
                                        </div>
                                    </>
                                )}
                            </div>
                        )}

                        {/* VIEW: HISTORY */}
                        {activeTab === 'history' && (
                            <Card title="Recorded History" className="no-print">
                                <div className="mb-6 p-4 bg-slate-50 rounded-lg border border-slate-100 flex flex-wrap gap-4 items-end">
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-500 mb-1">Year</label>
                                        <select value={filterYear} onChange={(e) => setFilterYear(e.target.value)} className="bg-white border border-slate-300 text-slate-700 text-sm rounded-md focus:ring-blue-500 p-2 w-32 outline-none">
                                            <option value="all">All Years</option>
                                            {availableYears.map(year => (<option key={year} value={year}>{year}</option>))}
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-500 mb-1">Month</label>
                                        <select value={filterMonth} onChange={(e) => setFilterMonth(e.target.value)} className="bg-white border border-slate-300 text-slate-700 text-sm rounded-md focus:ring-blue-500 p-2 w-40 outline-none">
                                            <option value="all">All Months</option>
                                            <option value="0">Jan</option><option value="1">Feb</option><option value="2">Mar</option><option value="3">Apr</option><option value="4">May</option><option value="5">Jun</option>
                                            <option value="6">Jul</option><option value="7">Aug</option><option value="8">Sep</option><option value="9">Oct</option><option value="10">Nov</option><option value="11">Dec</option>
                                        </select>
                                    </div>
                                </div>

                                <div className="flex justify-between items-center mb-4">
                                    <div className="text-sm text-slate-500">Showing {filteredRecords.length} records</div>
                                    <div className="flex gap-2">
                                        <button onClick={() => setActiveTab('report')} className="flex items-center gap-2 px-3 py-1.5 text-sm bg-indigo-50 text-indigo-700 border border-indigo-200 rounded hover:bg-indigo-100"><i data-lucide="file-text" className="w-4 h-4"></i> View Full Report</button>
                                        <button onClick={handleExportCSV} className="flex items-center gap-2 px-3 py-1.5 text-sm border border-slate-300 text-slate-700 rounded hover:bg-slate-50"><i data-lucide="download" className="w-4 h-4"></i> Export CSV</button>
                                    </div>
                                </div>

                                <div className="overflow-x-auto border border-slate-200 rounded-lg">
                                    <table className="w-full text-xs text-left whitespace-nowrap">
                                        <thead className="text-[11px] text-slate-500 uppercase bg-slate-100 border-b border-slate-200">
                                            <tr>
                                                <th className="px-3 py-3 border-r border-slate-200">Date</th>
                                                <th className="px-3 py-3 border-r border-slate-200">Status</th>
                                                <th className="px-3 py-3 text-right border-r border-slate-200 bg-blue-50" title="Delta Frequency">ΔF(Hz)</th>
                                                <th className="px-3 py-3 text-right border-r border-slate-200" title="Absolute Center Frequency">CF(Hz)</th>
                                                <th className="px-3 py-3 text-right border-r border-slate-200">TG(dB)</th>
                                                <th className="px-3 py-3 text-right border-r border-slate-200" title="Chiller Temp">Chil(°C)</th>
                                                <th className="px-3 py-3 text-right border-r border-slate-200" title="GC Out T">GCO(°C)</th>
                                                <th className="px-3 py-3 text-right border-r border-slate-200" title="GA Out T">GAO(°C)</th>
                                                <th className="px-3 py-3 text-right border-r border-slate-200" title="GC In P">GCi(b)</th>
                                                <th className="px-3 py-3 text-right border-r border-slate-200" title="GA In P">GAi(b)</th>
                                                <th className="px-3 py-3 text-right border-r border-slate-200" title="HE Re T">HE(°C)</th>
                                                <th className="px-3 py-3 text-center">Actions</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {filteredRecords.map((record) => (
                                                <tr key={record.id} className="border-b border-slate-100 hover:bg-blue-50 transition-colors">
                                                    <td className="px-3 py-2 border-r border-slate-100">{formatDate(record.date)}</td>
                                                    <td className="px-3 py-2 border-r border-slate-100">
                                                        <span title={record.violations?.length ? record.violations.map(v => `${v.label}: ${v.message}`).join(' | ') : 'Within tolerance'} className={`px-2 py-1 rounded text-[10px] font-bold ${record.status === 'PASS' ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}`}>{record.status}</span>
                                                    </td>
                                                    <td className="px-3 py-2 text-right font-mono border-r border-slate-100 bg-blue-50/50 font-bold">{record.deltaFreq}</td>
                                                    <td className="px-3 py-2 text-right font-mono border-r border-slate-100 text-slate-400">{record.cf || '-'}</td>
                                                    <td className="px-3 py-2 text-right font-mono border-r border-slate-100">{record.tg}</td>
                                                    <td className="px-3 py-2 text-right font-mono border-r border-slate-100 text-slate-500">{record.chillerTemp || '-'}</td>
                                                    <td className="px-3 py-2 text-right font-mono border-r border-slate-100 text-slate-500">{record.gcOutT || '-'}</td>
                                                    <td className="px-3 py-2 text-right font-mono border-r border-slate-100 text-slate-500">{record.gaOutT || '-'}</td>
                                                    <td className="px-3 py-2 text-right font-mono border-r border-slate-100 text-slate-500">{record.gcInP || '-'}</td>
                                                    <td className="px-3 py-2 text-right font-mono border-r border-slate-100 text-slate-500">{record.gaInP || '-'}</td>
                                                    <td className="px-3 py-2 text-right font-mono border-r border-slate-100 text-slate-500">{record.heReT || '-'}</td>
                                                    <td className="px-3 py-2 text-center">
                                                        <div className="flex items-center justify-center gap-2">
                                                            <button onClick={() => handleEdit(record)} className="text-blue-500 hover:text-blue-700 hover:bg-blue-100 p-1 rounded" title="Edit"><i data-lucide="edit-2" className="w-4 h-4"></i></button>
                                                            <button onClick={() => handleDelete(record.id)} className="text-red-500 hover:text-red-700 hover:bg-red-100 p-1 rounded" title="Delete"><i data-lucide="trash-2" className="w-4 h-4"></i></button>
                                                        </div>
                                                    </td>
                                                </tr>
                                            ))}
                                            {filteredRecords.length === 0 && <tr><td colSpan="12" className="px-4 py-8 text-center text-slate-400">No records found.</td></tr>}
                                        </tbody>
                                    </table>
                                </div>
                            </Card>
                        )}

                        {/* VIEW: FULL REPORT */}
                        {activeTab === 'report' && (
                            <div className="bg-white rounded-xl shadow-lg p-8 min-h-screen">
                                <div className="no-print flex justify-between items-center mb-8 border-b border-slate-200 pb-4">
                                    <button onClick={() => setActiveTab('history')} className="flex items-center gap-2 text-slate-600 hover:text-slate-900 px-3 py-2 rounded-lg hover:bg-slate-100"><i data-lucide="arrow-left" className="w-5 h-5"></i> Back to History</button>
                                    <div className="flex items-center gap-4">
                                        <p className="text-sm text-slate-500">Ready to print. Layout optimized for Portrait A4.</p>
                                        <button onClick={() => window.print()} className="bg-blue-600 text-white px-5 py-2.5 rounded-lg flex items-center gap-2 hover:bg-blue-700 font-medium"><i data-lucide="printer" className="w-5 h-5"></i> Print / Save PDF</button>
                                    </div>
                                </div>

                                <div id="report-content">
                                    <div className="text-center mb-8 border-b-2 border-slate-800 pb-4">
                                        <h1 className="text-2xl font-extrabold text-slate-900 uppercase tracking-wide mb-2">MRI Quality Control Report</h1>
                                        <h2 className="text-lg font-semibold text-slate-700">{MACHINE_PROFILES[selectedMachine].name}</h2>
                                        <div className="flex justify-center gap-8 mt-2 text-xs text-slate-600 font-medium">
                                            <p><span className="text-slate-400">Period:</span> {filterMonth !== 'all' ? new Date(0, filterMonth).toLocaleString('default', { month: 'long' }) : 'All Months'} {filterYear !== 'all' ? filterYear : 'All Years'}</p>
                                            <p><span className="text-slate-400">Total Records:</span> {filteredRecords.length}</p>
                                            <p><span className="text-slate-400">Generated:</span> {new Date().toLocaleDateString()}</p>
                                        </div>
                                    </div>

                                    {/* Simplified Chart Generation for Print Report */}
                                    {filteredRecords.length > 0 && (
                                        <div className="mb-8">
                                            <h3 className="text-base font-bold text-slate-800 mb-4 border-l-4 border-blue-600 pl-2">Trend Analysis Graphs</h3>
                                            <div className="grid grid-cols-1 gap-4">
                                                
                                                {/* ALL 16 GRAPHS IN PRINT REPORT */}
                                                {[
                                                    { 
                                                        data: cfData, 
                                                        label: 'CF Daily Trend (Zoomed)', 
                                                        color: '#2563eb', 
                                                        showLimits: false 
                                                    },
                                                    { 
                                                        data: cfData, 
                                                        label: 'Absolute CF (Philips Spec)', 
                                                        color: '#4f46e5', 
                                                        max: currentProfile.cfMax, 
                                                        min: currentProfile.cfMin, 
                                                        showLimits: true 
                                                    },
                                                    { data: tgData, label: 'TG (dB)', color: '#0891b2', showLimits: false },
                                                    ...(currentProfile.isZeroBoilOff ? [] : [{ data: heliumData, label: 'Helium Level (%)', color: '#16a34a', min: currentProfile.heMin, showLimits: true }]),
                                                    { data: roomTempData, label: 'Room Temp (°C)', color: '#f43f5e', max: currentProfile.roomTempMax, showLimits: !!currentProfile.roomTempMax },
                                                    { data: roomHumidityData, label: 'Room Humidity (%)', color: '#a855f7', max: currentProfile.roomHumidMax, showLimits: !!currentProfile.roomHumidMax },
                                                    { data: chillerTempData, label: 'Chiller Temp (°C)', color: '#7c3aed', max: currentProfile.chillerTempMax, min: currentProfile.chillerTempMin, showLimits: true },
                                                    { data: waterTempData, label: 'Pri. Water Temp (°C)', color: '#0284c7', max: currentProfile.waterTempMax, showLimits: !!currentProfile.waterTempMax },
                                                    { data: waterFlowData, label: 'Pri. Water Flow (L/H)', color: '#0ea5e9', min: currentProfile.waterFlowMin, showLimits: !!currentProfile.waterFlowMin },
                                                    { data: heReTData, label: 'HE. RE. T. (°C)', color: '#d97706', showLimits: false },
                                                    { data: gcOutTData, label: 'GC Out T (°C)', color: '#e11d48', max: currentProfile.gcOutTMax, showLimits: !!currentProfile.gcOutTMax },
                                                    { data: gaOutTData, label: 'GA Out T (°C)', color: '#ea580c', max: currentProfile.gaOutTMax, showLimits: !!currentProfile.gaOutTMax },
                                                    { data: gcInPData, label: 'GC In P (bar)', color: '#059669', max: currentProfile.gcInPMax, min: currentProfile.gcInPMin, showLimits: true },
                                                    { data: gaInPData, label: 'GA In P (bar)', color: '#10b981', max: currentProfile.gaInPMax, min: currentProfile.gaInPMin, showLimits: true },
                                                    { data: gc3WayVData, label: 'GC 3-Way V. (v.)', color: '#8b5cf6', max: currentProfile.gc3WayVMax, min: currentProfile.gc3WayVMin, showLimits: !!currentProfile.gc3WayVMax },
                                                    { data: ga3WayVData, label: 'GA 3-Way V. (v.)', color: '#a855f7', max: currentProfile.ga3WayVMax, min: currentProfile.ga3WayVMin, showLimits: !!currentProfile.ga3WayVMax }
                                                ].map((graph, idx) => (
                                                    <div key={idx} className="border border-slate-200 rounded-lg p-3 break-inside-avoid shadow-sm bg-white">
                                                        <h4 className="text-center font-bold text-slate-700 mb-1 text-xs">{graph.label}</h4>
                                                        <div className="h-48 w-full relative">
                                                            <TrendChart data={graph.data} label={graph.label} color={graph.color} upperLimit={graph.max} lowerLimit={graph.min} showLimits={graph.showLimits} />
                                                        </div>
                                                    </div>
                                                ))}

                                            </div>
                                        </div>
                                    )}

                                    <div className="page-break"></div>

                                    {/* Data Table Print */}
                                    <div className="mt-4 mb-8">
                                        <h3 className="text-base font-bold text-slate-800 mb-3 border-l-4 border-blue-600 pl-2">Detailed Data Log</h3>
                                        <div className="overflow-hidden border border-slate-300">
                                            <table className="w-full text-[8px] text-center border-collapse">
                                                <thead className="bg-slate-100 border-b-2 border-slate-300">
                                                    <tr>
                                                        <th className="p-1 border border-slate-200 text-slate-600">Date</th>
                                                        <th className="p-1 border border-slate-200 text-slate-600">Stat</th>
                                                        <th className="p-1 border border-slate-200 text-blue-700">ΔF</th>
                                                        <th className="p-1 border border-slate-200 text-slate-400">CF</th>
                                                        <th className="p-1 border border-slate-200 text-slate-600">TG</th>
                                                        <th className="p-1 border border-slate-200 text-slate-600">Chil</th>
                                                        <th className="p-1 border border-slate-200 text-slate-600">Flow</th>
                                                        <th className="p-1 border border-slate-200 text-slate-600">GCO</th>
                                                        <th className="p-1 border border-slate-200 text-slate-600">GAO</th>
                                                        <th className="p-1 border border-slate-200 text-slate-600">GCi</th>
                                                        <th className="p-1 border border-slate-200 text-slate-600">GAi</th>
                                                        <th className="p-1 border border-slate-200 text-slate-600">HE</th>
                                                        <th className="p-1 border border-slate-200 text-slate-600">GC3</th>
                                                        <th className="p-1 border border-slate-200 text-slate-600">GA3</th>
                                                    </tr>
                                                </thead>
                                                <tbody>
                                                    {filteredRecords.map((record, idx) => (
                                                        <tr key={record.id} className={idx % 2 === 0 ? 'bg-white' : 'bg-slate-50'}>
                                                            <td className="p-1 border border-slate-200 whitespace-nowrap">{formatDate(record.date)}</td>
                                                            <td className={`p-1 border border-slate-200 font-bold ${record.status === 'PASS' ? 'text-green-600' : 'text-red-600'}`}>{record.status === 'PASS' ? 'P' : 'NP'}</td>
                                                            <td className="p-1 border border-slate-200 font-mono font-bold">{record.deltaFreq}</td>
                                                            <td className="p-1 border border-slate-200 font-mono text-slate-400">{record.cf || '-'}</td>
                                                            <td className="p-1 border border-slate-200 font-mono">{record.tg}</td>
                                                            <td className="p-1 border border-slate-200 font-mono">{record.chillerTemp}</td>
                                                            <td className="p-1 border border-slate-200 font-mono">{record.waterFlow}</td>
                                                            <td className="p-1 border border-slate-200 font-mono">{record.gcOutT}</td>
                                                            <td className="p-1 border border-slate-200 font-mono">{record.gaOutT}</td>
                                                            <td className="p-1 border border-slate-200 font-mono">{record.gcInP}</td>
                                                            <td className="p-1 border border-slate-200 font-mono">{record.gaInP}</td>
                                                            <td className="p-1 border border-slate-200 font-mono">{record.heReT}</td>
                                                            <td className="p-1 border border-slate-200 font-mono">{record.gc3WayV}</td>
                                                            <td className="p-1 border border-slate-200 font-mono">{record.ga3WayV}</td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    </div>

                                    {/* Sign Off */}
                                    <div className="mt-12 grid grid-cols-2 gap-16 px-8 break-inside-avoid">
                                        <div><div className="border-b border-black h-6"></div><p className="mt-2 text-xs font-medium text-slate-800 text-center">Reviewing Medical Physicist</p></div>
                                        <div><div className="border-b border-black h-6"></div><p className="mt-2 text-xs font-medium text-slate-800 text-center">Date</p></div>
                                    </div>
                                    <div className="mt-8 pt-4 border-t border-slate-200 text-center break-inside-avoid">
                                        <p className="text-[10px] font-semibold text-slate-600">จัดทำโดย ทีมฟิสิกส์การแพทย์ รังสีวินิจฉัย คณะแพทยศาสตร์ มหาวิทยาลัยสงขลานครินทร์</p>
                                    </div>

                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
